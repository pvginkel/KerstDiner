# The three lockfiles (uv.lock, backend/uv.lock, frontend/pnpm-lock.yaml) were
# written once, at onboarding, and are committed, so `setup` syncs `--locked`
# and `--frozen-lockfile` as CI, the suite runner and the Dockerfiles do: a lock
# out of step with its manifest fails setup rather than being rewritten in the
# tree.
projects:
  root:
    description: >-
      KerstDiner monorepo — orchestration tooling (the suite runner), the
      shared Procfile.dev dev stack, and CI.
    setup: cexec modern-app uv sync --locked
    # The root's own Python, and the architecture model; backend/ and frontend/
    # lint themselves.
    lint:
      # The rule set and the Ruff version are pinned in the root pyproject.toml.
      - cexec modern-app uv run ruff check scripts tools
      # The model AaC/KerstDiner validates (Jenkinsfile.architecture).
      # A new app has none until it is seeded (CLAUDE.md), and this skips it.
      # arch-validate exits 0 valid, 1 invalid, 2 transport: a 2 is the
      # architecture service, not this repository.
      - "if ls docs/architecture/*.yaml >/dev/null 2>&1; then cexec aac-tools arch-validate docs/architecture/*.yaml; else echo 'No architecture model in docs/architecture/ yet: CLAUDE.md says how to seed it'; fi"
    # No `test:` here on purpose. The root project owns `run-suite`
    # (tools/suite_runner), which is CI's single entry point and runs the
    # backend and frontend suites itself — declaring it here would make
    # `kc project test` run both suites two extra times. The per-component
    # verbs below are those same two suites, once each. CI keeps using
    # `uv run run-suite` because it also needs the JUnit XML, the retries
    # and the ===SUITE_RESULT:=== markers the Jenkinsfile parses.

  backend:
    description: >-
      The family's Christmas dinner of 25 December 2026: who comes, and who brings which dish and servies — Flask backend.
    setup:
      - cexec modern-app uv sync --locked
      - "test -f .env || printf 'DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/kerstdiner\\n' > .env"
      - cexec modern-app uv run python scripts/init-dev-database.py
      - cexec modern-app uv run cli upgrade-db
    test: cexec modern-app uv run pytest
    # The same three checks backend/scripts/check.py runs.
    lint:
      - cexec modern-app uv run ruff check .
      - cexec modern-app uv run mypy .
      - cexec modern-app uv run vulture app/ vulture_whitelist.py --min-confidence 80

  frontend:
    description: >-
      React SPA with a generated OpenAPI client; Playwright E2E suite that boots
      the backend per worker.
    setup:
      - cexec modern-app pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - cexec modern-app pnpm playwright install chromium
    # `pnpm build` also runs `pnpm check`; the lint verb below repeats it so the
    # gate stands on its own.
    build: cexec modern-app pnpm build
    test: cexec modern-app pnpm playwright test
    lint: cexec modern-app pnpm check
