# KubeCoder environment manifest for the KerstDiner monorepo.
#
# One sidecar rather than `python` + `frontend`: the Playwright harness boots the
# Flask backend per worker (frontend/tests/support/process/servers.ts), so a
# single command needs both toolsets in the same container.
#
# `postgres` serves the dev stack's database: the backend's default
# DATABASE_URL points at localhost:5432/kerstdiner, and `kc project setup`
# creates that database and applies the migrations. The backend suite and
# Playwright (a clone of a seed database per worker) create their own
# databases on the same server (TEST_DATABASE_ADMIN_URL) and never touch the
# dev one.
#
# KerstDiner takes no AI-workflow onboarding, so it has no spec repository (the
# template's KerstDinerSpecs entry is dropped).

capabilities:
  github: rw

repos:
  # The Argo CD deploy repository the Jenkinsfile pins images into
  # (cicd.writeVersionPins); its project.yaml runs through iac and aac-tools.
  - url: https://github.com/pvginkel/KerstDinerDeploy

tools:
  - use: modern-app
  # arch-validate, for the architecture model's lint step (project.yaml); the
  # AaC/KerstDiner job runs the same command. chart-deps, for the deploy repo's
  # verbs.
  - use: aac-tools
  # helm and terraform, for the deploy repo's verbs.
  - use: iac

services:
  - postgres

# Proves backend/Dockerfile and frontend/Dockerfile with the `kaniko` client
# (`kaniko --no-push`, run from the Dockerfile's directory) before a push hands
# them to Jenkins, which builds them with helmCharts.kaniko2(...). Neither is
# wired into a build: verb.
imageBuilder: true

ports:
  - name: frontend
    port: 3700
    type: http
    sslOffload: true
  - name: backend
    port: 3701
    type: http
