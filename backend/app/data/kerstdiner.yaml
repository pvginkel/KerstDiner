# KerstDiner's households, dishes and servies (docs/design.md, "The config file").
# Every deploy syncs this file into the database.

reset: 3    # raise to wipe every answer, claim and link on the next deploy

# A household's guess counts vegan, vegetarisch, normaal (eet alles) and kind
# (kindermenu <6jr: only children under 6; older children count as adults do).
# A category left out is 0.
households:
  - key: hosts
    name: De Organisatie
    guess: {vegetarisch: 1, normaal: 1}
  - key: hans-henny
    name: Hans & Henny
    guess: {normaal: 2}
  - key: erik-maartje
    name: Erik, Maartje en de kinderen
    guess: {normaal: 2, kind: 2}
  - key: kimberley
    name: Kimberley
    guess: {normaal: 1}
  - key: jaap-julian
    name: Jaap en Julian
    guess: {normaal: 2}
  - key: jeroen-margot
    name: Jeroen & Margôt
    guess: {vegetarisch: 2}
  - key: riske-max
    name: Riske & Max
    guess: {vegan: 2}
  - key: mels
    name: Mels
    guess: {vegetarisch: 1}
  - key: mums
    name: Mums
    guess: {normaal: 1}

# A dish is made for vegan, vegetarisch and normaal at most; without "for", for
# all three. No dish is made for the kindermenu. "image" is a file in
# frontend/public/gerechten/; without one the tile shows a placeholder.
dishes:
  - key: soep
    name: Vegan soep
    image: soep.jpg
  - key: aardappels
    name: Roast potatoes of gebakken aardappeltjes
    image: aardappels.jpg
  - key: groente
    name: Een of meer groentes, zoals spruitjes, boontjes, witlof, broccoli, bloemkool
    image: groente.jpg
  - key: stoofperen
    name: Stoofperen
    image: stoofperen.jpg
  - key: vegan-burger
    name: Vegan burger
    for: [vegan, vegetarisch]
    image: vegan-burger.jpg
  - key: vlees
    name: Stukje vlees naar keuze (bv. kip, burger, stoofvlees, etc) - biologisch, geen rundvlees
    for: [normaal]
    image: vlees.jpg
  - key: toetje-vegan
    name: Vegan toetje
    for: [vegan]
    image: toetje-vegan.jpg
  - key: toetje-vega
    name: Vegetarisch toetje (geen alleseter toetje, dus bv. geen bavarois)
    for: [vegetarisch, normaal]
    image: toetje-vega.jpg

# Servies: "text" is what the tile says. "image" is a file in
# frontend/public/servies/; without one the tile shows a placeholder.
servies:
  - key: mokken
    text: 2 mokken
    image: mokken.jpg
  - key: soepkommen
    text: 4 soepkommen
    image: soepkommen.jpg
  - key: grote-borden
    text: 5 grote borden
    image: grote-borden.jpg
